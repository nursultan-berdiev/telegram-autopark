server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой неизвестный путь отдаёт index.html (роутинг на клиенте).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси /api и /admin на core-api делает внешний Caddy (Phase 5), не nginx.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
