# Платформа управления автопарком: core-api (домен и БД) + tracker-adapter
# (Traccar/H02) + bot (Telegram). Контекст сборки у всех — корень репозитория:
# сервисам нужен общий пакет libs/contracts.
#
# ИИ живёт в claude-gateway (внешняя сеть claude_net), ключей в образах нет:
#   cd ../claude-gateway && docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: fleet_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: tg_auto
      POSTGRES_PASSWORD: tg_auto
      POSTGRES_DB: tg_auto
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tg_auto -d tg_auto"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Брокер в отдельной сети и с паролем: очередь celery — это исполнение
  # кода, и доступ к ней в обход HTTP-слоя обходит проверку прав админа.
  redis:
    image: redis:7-alpine
    container_name: fleet_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD не задан}"]
    networks:
      - broker
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core-api:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    container_name: fleet_core_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tg_auto:tg_auto@postgres:5432/tg_auto
      AI_BACKEND: http
      GATEWAY_URL: http://claude_gw_api:8080
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      GATEWAY_MODEL: ${GATEWAY_MODEL:-sonnet}
      ADAPTER_URL: http://tracker-adapter:8001
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - files:/app/storage
    networks:
      - default
      - broker
      - claude_net

  tracker-adapter:
    build:
      context: .
      dockerfile: services/tracker-adapter/Dockerfile
    container_name: fleet_tracker_adapter
    restart: unless-stopped
    env_file: .env
    environment:
      CORE_API_URL: http://core-api:8000
    depends_on:
      - core-api
    networks:
      - default
      - traccar_net

  # Воркер и beat крутят тот же образ, что и core-api: своя копия моделей
  # разошлась бы с доменом на первой же миграции.
  celery-worker:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile.worker
    container_name: fleet_celery_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tg_auto:tg_auto@postgres:5432/tg_auto
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "-l", "info", "--concurrency", "1"]
    networks:
      - default
      - broker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - files:/app/storage

  celery-beat:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    container_name: fleet_celery_beat
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tg_auto:tg_auto@postgres:5432/tg_auto
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "beat", "-l", "info"]
    networks:
      - default
      - broker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: services/bot/Dockerfile
    container_name: fleet_bot
    restart: unless-stopped
    env_file: .env
    environment:
      CORE_API_URL: http://core-api:8000
    depends_on:
      - core-api

networks:
  # Сеть брокера: в ней только core-api, воркер и beat. Бот и адаптер
  # к очереди задач отношения не имеют.
  broker:
  claude_net:
    external: true
    name: claude_net
  # Сеть до Traccar: адаптер ходит к нему, наружу торчит только адаптер.
  traccar_net:
    external: true
    name: ${TRACCAR_NETWORK:-claude_net}

volumes:
  pg_data:
  files:
