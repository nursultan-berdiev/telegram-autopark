<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
      label { display: block; margin: 14px 0 4px; font-weight: 600; }
      input[type='text'], input[type='number'] { width: 100%; padding: 6px; font: inherit; }
      .hint { color: #666; font-weight: 400; font-size: 12px; }
      button { font: inherit; padding: 6px 14px; margin-top: 18px; cursor: pointer; }
      #status { margin-left: 10px; color: #060; }
      pre { background: #f5f5f5; padding: 10px; overflow: auto; max-height: 320px; }
    </style>
  </head>
  <body>
    <h1>Проверка штрафов парка</h1>

    <label>Адрес core-api <span class="hint">только https (исключение — localhost)</span></label>
    <input type="text" id="apiUrl" placeholder="https://..." />

    <label>FINES_IMPORT_TOKEN <span class="hint">узкий токен только на импорт штрафов</span></label>
    <input type="password" id="token" autocomplete="off" />

    <label>Telegram-id админа <span class="hint">от его имени заводятся штрафы</span></label>
    <input type="text" id="adminId" />

    <label>Пауза между номерами, мс <span class="hint">меньше 5000 ставить не стоит</span></label>
    <input type="number" id="pauseMs" min="3000" step="500" />

    <label><input type="checkbox" id="dryRun" /> Пробный прогон
      <span class="hint">только собирает ответы, в core-api ничего не пишет</span></label>

    <button id="save">Сохранить</button><span id="status"></span>

    <h2>Последний прогон</h2>
    <pre id="raw">—</pre>

    <script src="options.js"></script>
  </body>
</html>
